# midnite™ couch crew server: who's on the couch right now.
# Deployed by .github/workflows/worker.yml (needs repo secrets
# CLOUDFLARE_API_TOKEN and CREW_CODE).
name = "midnite-couch"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# ClipCafe closed its API (2026-11-27) but allowed couch to fetch the ~200
# clips the scenes game needs from the site (account xnite7), kept on our side.
# CLIPS_POOL_ONLY: clips (and previews) only for the game's films.
# CLIPS_PAUSED = "1" switches clips and the game off.
[vars]
CLIPS_PAUSED = ""
CLIPS_POOL_ONLY = "1"

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.jpg", "**/*.woff2"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "CREW"
class_name = "Crew"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Crew"]
# bot token picked up 2026-11-07
