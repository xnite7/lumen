# midnite™ couch crew server: who's on the couch right now.
# Deployed by .github/workflows/worker.yml (needs repo secrets
# CLOUDFLARE_API_TOKEN and CREW_CODE).
name = "midnite-couch"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# ClipCafe closed its API (2026-11-27): clip previews and the scenes game are
# paused until there's a clip source again. Set to "" to bring them back.
[vars]
CLIPS_PAUSED = "1"

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.jpg", "**/*.woff2"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "CREW"
class_name = "Crew"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Crew"]
# bot token picked up 2026-11-07
