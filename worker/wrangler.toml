# midnite™ couch crew server: who's on the couch right now.
# Deployed by .github/workflows/worker.yml (needs repo secrets
# CLOUDFLARE_API_TOKEN and CREW_CODE).
name = "midnite-couch"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# ClipCafe gave couch its own API key (2026-11-27, no limits); the file on
# their site is the fallback (allowed for account xnite7).
# CLIPS_POOL_ONLY = "1": clips (and previews) only for the game's films
# (off since 2026-11-28: ClipCafe lifted the download cap).
# CLIPS_PAUSED = "1" switches clips and the game off.
[vars]
CLIPS_PAUSED = ""
CLIPS_POOL_ONLY = ""

[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.jpg", "**/*.webp", "**/*.woff2"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# fetched clips are kept here for good (one ClipCafe download per film, ever)
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "couch-clips"

[[durable_objects.bindings]]
name = "CREW"
class_name = "Crew"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Crew"]
# bot token picked up 2026-11-07
