[package]
name = "couch"
version = "0.1.0"
description = "couch — a native, addon-compatible streaming app"
authors = ["xnite"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "couch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "couch"
path = "src/main.rs"
required-features = ["tauri-app"]

[build-dependencies]
tauri-build = { version = "2.7", features = [], optional = true }

[dependencies]
tauri-plugin-couch-native = { path = "plugins/couch-native", optional = true }
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon", "image-png"], optional = true }
tauri-plugin-opener = { version = "2.7", optional = true }
tauri-plugin-deep-link = { version = "2.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
url = "2"
urlencoding = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
log = "0.4"
env_logger = "0.11"
dirs = "6"
bytes = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream", "http2", "charset"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "https-ring", "system-config", "webpki-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"

# Desktop-only: native mpv playback, single instance, window state, screen sampling.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
libmpv2 = "6"
libmpv2-sys = "4"
discord-rich-presence = "1.1"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"], optional = true }
tauri-plugin-window-state = { version = "2.5", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
libloading = "0.8"
webrtc-dtls = "0.12"
webrtc-util = { version = "0.11", default-features = false, features = ["conn"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[features]
default = ["custom-protocol", "tauri-app"]
custom-protocol = ["tauri-app", "tauri/custom-protocol"]
# the Tauri (webview) app; off for the engine on its own (the GPUI app)
tauri-app = [
  "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-couch-native", "dep:tauri-plugin-opener", "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state", "dep:tauri-plugin-updater", "dep:tauri-plugin-notification",
]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 1

[patch.crates-io]
# iOS support for bind_device (upstream only gates on macos)
librqbit-dualstack-sockets = { path = "patches/librqbit-dualstack-sockets" }
