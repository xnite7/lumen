[package]
name = "lumen"
version = "0.1.0"
description = "Lumen — a native, addon-compatible streaming app"
authors = ["xnite"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2.7"
tauri-plugin-deep-link = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
url = "2"
urlencoding = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
log = "0.4"
env_logger = "0.11"
dirs = "6"
bytes = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream", "http2", "charset"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio", "https-ring", "system-config", "webpki-roots"] }
rusqlite = { version = "0.37", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
librqbit = { version = "9", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
librqbit-dualstack-sockets = "0.7"

# Desktop-only: native mpv playback, single instance, window state, screen sampling.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
libmpv2 = "6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5"
libloading = "0.8"
webrtc-dtls = "0.12"
webrtc-util = { version = "0.11", default-features = false, features = ["conn"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = 0
incremental = true

[profile.dev.package."*"]
opt-level = 1

[patch.crates-io]
# iOS support for bind_device (upstream only gates on macos)
librqbit-dualstack-sockets = { path = "patches/librqbit-dualstack-sockets" }
