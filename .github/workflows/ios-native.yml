name: Build couch (iPhone / iPad, native)

# The native SwiftUI app (ios/). Every run builds an unsigned .ipa (kept as an
# artifact). With the App Store Connect secrets set, runs on gpui also sign it
# and send it to App Store Connect (TestFlight / App Store):
#   APPLE_TEAM_ID   the 10-character team id
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8's text): an App Store
#     Connect API key with the Admin role (Xcode makes the certificates and
#     profiles itself, "cloud signing")
# and the app made once in App Store Connect (bundle id com.midnite.couch).

on:
  push:
    branches: [gpui, ios-native, testflight]
    paths:
      - "ios/**"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

env:
  COUCH_VERSION: 1.1.${{ github.run_number }}

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Couch.xcodeproj -scheme Couch -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build ARCHS=arm64 \
            -skipPackagePluginValidation -skipMacroValidation \
            MARKETING_VERSION=$COUCH_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || true
          grep -q "BUILD SUCCEEDED" build.log || { echo "COUCH-ERRORS-BEGIN"; grep -E ": error:|error: |ld: |Undefined symbols" build.log | grep -v "^ *builtin-\|/usr/bin/clang" | cut -c1-400 | sort -u | head -100; echo "COUCH-ERRORS-END"; exit 1; }
          APP=$(find build/Build/Products -name "Couch.app" -maxdepth 3 | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr ../couch.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: couch-ios-native
          path: couch.ipa
      - name: Publish the sideload .ipa
        if: github.ref == 'refs/heads/gpui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=couch-ios
          gh release view $R >/dev/null 2>&1 || gh release create $R --prerelease --target "$GITHUB_SHA" --title "couch for iPhone / iPad" --notes "unsigned .ipa, sideload with AltStore or Sideloadly."
          gh release upload $R couch.ipa --clobber
          gh release edit $R --notes "unsigned .ipa, sideload with AltStore or Sideloadly. this one: $COUCH_VERSION"
      - name: Simulator screenshots (test branch only)
        if: github.ref == 'refs/heads/ios-native'
        working-directory: ios
        run: |
          set +e
          xcodebuild -project Couch.xcodeproj -scheme Couch -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1
          grep -q "BUILD SUCCEEDED" sim.log || { echo "COUCH-ERRORS-BEGIN"; grep -E ": error:|error: |ld: |Undefined symbols" sim.log | cut -c1-400 | sort -u | head -40; echo "COUCH-ERRORS-END"; exit 0; }
          APP=$(find simbuild/Build/Products -name "Couch.app" -maxdepth 3 | head -1)
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9]|iPhone Air" | grep -v -i "plus\|max\|e)" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "simulator: $DEV"
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          shot() {
            xcrun simctl io "$DEV" screenshot "$1.png" >/dev/null 2>&1
            sips -Z 900 -s format jpeg -s formatOptions 45 "$1.png" --out "$1.jpg" >/dev/null 2>&1
            echo "COUCH-SHOT-BEGIN $1"; base64 -i "$1.jpg" | fold -w 200; echo "COUCH-SHOT-END $1"
          }
          go() { xcrun simctl terminate "$DEV" com.midnite.couch >/dev/null 2>&1; xcrun simctl launch "$DEV" com.midnite.couch "$@" >/dev/null; }
          grep -n "AppIcon" Couch.xcodeproj/project.pbxproj | head -5
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP/Info.plist" 2>&1 | head -12
          sleep 6; shot springboard
          go; sleep 12; shot welcome
          go -demo; sleep 25; shot home
          go -open couch://title/series/tt0903747; sleep 16; shot title
          go -open couch://title/movie/tt1727587; sleep 14; shot movie
          go -open couch://pro; sleep 6; shot pro
          go -open couch://tab/search; sleep 12; shot search
          go -open couch://tab/settings; sleep 5; shot settings
          go -open couch://tab/play; sleep 9; shot play
          go -open couch://play/daily; sleep 16; shot round
          go -open couch://play/daily -revealAll; sleep 16; shot scene
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "Couch"' --style compact 2>/dev/null | grep -i -E "fatal|crash|error" | head -15
          exit 0
      - name: Signed build → App Store Connect (TestFlight / App Store)
        # (the testflight branch: a TestFlight build without a Windows release)
        if: github.ref == 'refs/heads/gpui' || github.ref == 'refs/heads/testflight'
        working-directory: ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -e
          if [ -z "$KID" ] || [ -z "$P8" ] || [ -z "$TEAM" ]; then echo "::warning::no App Store Connect key: unsigned .ipa only"; exit 0; fi
          KEY=$RUNNER_TEMP/AuthKey_$KID.p8
          printf '%s' "$P8" > $KEY
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"
          xcodebuild -project Couch.xcodeproj -scheme Couch -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/couch.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation $AUTH \
            DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic ARCHS=arm64 \
            MARKETING_VERSION=$COUCH_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive > archive.log 2>&1 || { echo "COUCH-ERRORS-BEGIN"; grep -E "error:|error |Provisioning|provisioning|entitlement|No profiles|requires a|doesn.t|Signing" archive.log | cut -c1-500 | sort -u | head -60; echo "COUCH-ERRORS-END"; exit 1; }
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/couch.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export $AUTH > export.log 2>&1 || { echo "COUCH-ERRORS-BEGIN"; grep -v "^$" export.log | cut -c1-500 | tail -60; echo "COUCH-ERRORS-END"; exit 1; }
          tail -5 export.log
          echo "### sent to App Store Connect: $COUCH_VERSION (build ${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
