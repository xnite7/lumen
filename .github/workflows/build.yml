name: Build Lumen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mpv.ps1
      - run: npm ci
      - name: Build installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  ios:
    # Unsigned .ipa for sideloading (AltStore / Sideloadly re-sign it with
    # your Apple ID). Experimental: playback uses the system player, so
    # MKV/HEVC files open in VLC or Infuse instead.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Generate Xcode project
        run: npx tauri ios init --ci
      - name: Build frontend
        run: npm run build
      - name: Build Rust library for iOS
        # Built here instead of inside Xcode: Tauri's Xcode build phase only
        # works while `tauri ios build` is running, and that command insists
        # on code signing. The library gets dropped where Xcode expects it.
        working-directory: src-tauri
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo build --release --lib --target aarch64-apple-ios --features tauri/custom-protocol
          mkdir -p gen/apple/Externals/arm64/release gen/apple/Externals/arm64/Release
          cp target/aarch64-apple-ios/release/liblumen_lib.a gen/apple/Externals/arm64/release/libapp.a
          cp target/aarch64-apple-ios/release/liblumen_lib.a gen/apple/Externals/arm64/Release/libapp.a
      - name: Add widget extension and iPhone permissions
        working-directory: src-tauri/gen/apple
        run: |
          pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml
          python3 ../../../scripts/ios-project.py
          which xcodegen || brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Disable Xcode's Rust build phase
        working-directory: src-tauri/gen/apple
        run: |
          python3 - <<'PY'
          import re, glob
          p = glob.glob('*.xcodeproj/project.pbxproj')[0]
          s = open(p).read()
          s, n = re.subn(r'shellScript = "(?:[^"\\]|\\.)*?xcode-script(?:[^"\\]|\\.)*";', 'shellScript = "true";', s)
          print("patched build phases:", n)
          assert n, "Rust build phase not found"
          open(p, 'w').write(s)
          PY
          xcodebuild -list -project lumen.xcodeproj
      - name: Build app (unsigned)
        working-directory: src-tauri/gen/apple
        run: |
          CONF=$(xcodebuild -list -project lumen.xcodeproj | awk '/Build Configurations:/{f=1;next} f&&NF{print $1; exit}' )
          for c in release Release; do xcodebuild -list -project lumen.xcodeproj | grep -qx "        $c" && CONF=$c; done
          echo "configuration: $CONF"
          xcodebuild -project lumen.xcodeproj -scheme lumen_iOS -configuration "$CONF" -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "app: $APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr ../../../Lumen-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-iOS-unsigned
          path: Lumen-unsigned.ipa
