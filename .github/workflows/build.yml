name: Build couch

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # service keys compiled into couch (Settings → Secrets and variables → Actions)
  COUCH_TMDB_KEY: ${{ secrets.COUCH_TMDB_KEY }}
  COUCH_TIDB_KEY: ${{ secrets.COUCH_TIDB_KEY }}
  COUCH_MOTN_KEY: ${{ secrets.COUCH_MOTN_KEY }}
  COUCH_AI_KEY: ${{ secrets.COUCH_AI_KEY }}
  # only members of this Discord server can use couch
  COUCH_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
  # every build is a new version, so the app knows to update
  COUCH_VERSION: 0.3.${{ github.run_number }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mpv.ps1
      - run: npm ci
      - name: Set version
        shell: bash
        run: |
          node -e '
            const fs = require("fs"); const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.env.COUCH_VERSION;
            // no signing key yet: build without update packages
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY) c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          '
      - name: Build installer
        run: npx tauri build
      - name: Build couch setup (custom installer window)
        shell: bash
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          export COUCH_PAYLOAD="$PWD/$exe"
          cargo build --release --manifest-path setup/Cargo.toml
          mkdir -p dist-setup
          cp setup/target/release/couch-setup.exe "dist-setup/couch-setup-$COUCH_VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: couch-Windows
          path: |
            dist-setup/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish update
        if: github.ref == 'refs/heads/main' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          exe=$(ls *-setup.exe | head -1)
          node -e '
            const fs = require("fs");
            const exe = process.argv[1];
            const notes = process.env.NOTES.split("\n")[0];
            fs.writeFileSync("latest.json", JSON.stringify({
              version: process.env.COUCH_VERSION,
              notes,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(exe + ".sig", "utf8"),
                url: "https://midnite-couch.xnite7.workers.dev/v1/update/file/" + encodeURIComponent(exe),
              } },
            }, null, 2));
          ' "$exe"
          gh release create "v$COUCH_VERSION" "$exe" "$exe.sig" latest.json --repo "${{ github.repository }}" --title "couch $COUCH_VERSION" --notes "$NOTES" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  ios:
    # Unsigned .ipa for sideloading (AltStore / Sideloadly re-sign it with
    # your Apple ID). Experimental: playback uses the system player, so
    # MKV/HEVC files open in VLC or Infuse instead.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Set version
        run: |
          node -e '
            const fs = require("fs"); const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.env.COUCH_VERSION;
            c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          '
      - name: Generate Xcode project
        run: npx tauri ios init --ci
      - name: Build frontend
        run: npm run build
      - name: Build Rust library for iOS
        # Built here instead of inside Xcode: Tauri's Xcode build phase only
        # works while `tauri ios build` is running, and that command insists
        # on code signing. The library gets dropped where Xcode expects it.
        working-directory: src-tauri
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo build --release --lib --target aarch64-apple-ios --features tauri/custom-protocol
          mkdir -p gen/apple/Externals/arm64/release gen/apple/Externals/arm64/Release
          cp target/aarch64-apple-ios/release/libcouch_lib.a gen/apple/Externals/arm64/release/libapp.a
          cp target/aarch64-apple-ios/release/libcouch_lib.a gen/apple/Externals/arm64/Release/libapp.a
      - name: Add widget extension and iPhone permissions
        working-directory: src-tauri/gen/apple
        run: |
          pip3 install --quiet --break-system-packages pyyaml || pip3 install --quiet pyyaml
          python3 ../../../scripts/ios-project.py
          which xcodegen || brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Disable Xcode's Rust build phase
        working-directory: src-tauri/gen/apple
        run: |
          python3 - <<'PY'
          import re, glob
          p = glob.glob('*.xcodeproj/project.pbxproj')[0]
          s = open(p).read()
          s, n = re.subn(r'shellScript = "(?:[^"\\]|\\.)*?xcode-script(?:[^"\\]|\\.)*";', 'shellScript = "true";', s)
          print("patched build phases:", n)
          assert n, "Rust build phase not found"
          open(p, 'w').write(s)
          PY
          PROJ=$(ls -d *.xcodeproj | head -1); echo "project: $PROJ"; xcodebuild -list -project "$PROJ"
      - name: Build app (unsigned)
        working-directory: src-tauri/gen/apple
        run: |
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | grep -o "[A-Za-z0-9_-]*_iOS" | head -1)
          echo "project: $PROJ scheme: $SCHEME"
          CONF=$(xcodebuild -list -project "$PROJ" | awk '/Build Configurations:/{f=1;next} f&&NF{print $1; exit}' )
          for c in release Release; do xcodebuild -list -project "$PROJ" | grep -qx "        $c" && CONF=$c; done
          echo "configuration: $CONF"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration "$CONF" -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build ARCHS=arm64 \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          echo "app: $APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr ../../../couch-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: couch-iOS-unsigned
          path: couch-unsigned.ipa
