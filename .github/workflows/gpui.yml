name: Build couch (GPUI)

on:
  push:
    branches: [gpui]
  workflow_dispatch:

env:
  COUCH_TMDB_KEY: ${{ secrets.COUCH_TMDB_KEY }}
  COUCH_TIDB_KEY: ${{ secrets.COUCH_TIDB_KEY }}
  COUCH_MOTN_KEY: ${{ secrets.COUCH_MOTN_KEY }}
  COUCH_AI_KEY: ${{ secrets.COUCH_AI_KEY }}
  COUCH_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
  COUCH_ROLES: ${{ secrets.ALLOWED_ROLE_IDS }}
  # the new app's own version line (the webview app is 0.3.x)
  COUCH_VERSION: 0.9.${{ github.run_number }}

concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch GPUI (Zed's official source, the tag in desktop/Cargo.toml)
        shell: bash
        run: ./scripts/fetch-zed.sh
      - name: Fetch libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mpv.ps1
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/target/release/couch.exe dist/
          Copy-Item src-tauri/mpv/libmpv-2.dll dist/
          # Start menu tile (Windows 10): couch's colour + mark
          Copy-Item desktop/resources/couch.VisualElementsManifest.xml dist/
          Copy-Item -Recurse desktop/resources/tiles dist/tiles
          # trailers (YouTube) play through yt-dlp
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile dist/yt-dlp.exe
      - uses: actions/upload-artifact@v4
        with:
          name: couch-gpui-windows
          path: dist/
      - name: Publish (beta channel)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path dist/* -DestinationPath couch-gpui.zip -Force
          $notes = git log -1 --pretty=%s
          gh release create "gpui-$env:COUCH_VERSION" couch-gpui.zip --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" --title "couch (new) $env:COUCH_VERSION" --notes "$notes"
