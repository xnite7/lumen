name: Build couch (GPUI)

on:
  push:
    branches: [gpui]
  workflow_dispatch:

env:
  COUCH_TMDB_KEY: ${{ secrets.COUCH_TMDB_KEY }}
  COUCH_TIDB_KEY: ${{ secrets.COUCH_TIDB_KEY }}
  COUCH_MOTN_KEY: ${{ secrets.COUCH_MOTN_KEY }}
  COUCH_AI_KEY: ${{ secrets.COUCH_AI_KEY }}
  COUCH_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
  COUCH_ROLES: ${{ secrets.ALLOWED_ROLE_IDS }}
  # the new app's own version line (the webview app is 0.3.x)
  COUCH_VERSION: 0.9.${{ github.run_number }}

concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # a quick look at whether the smart bar's model answers (status codes only)
  ai-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ai-check.py
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # keep GPUI (a path crate) and the engine's build too, not just crates.io ones
          cache-workspace-crates: "true"
          cache-all-crates: "true"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch GPUI (Zed's official source, the tag in desktop/Cargo.toml)
        shell: bash
        run: ./scripts/fetch-zed.sh
      - name: Fetch libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-mpv.ps1
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/target/release/couch.exe dist/
          Copy-Item src-tauri/mpv/libmpv-2.dll dist/
          # Start menu tile (Windows 10): couch's colour + mark
          Copy-Item desktop/resources/couch.VisualElementsManifest.xml dist/
          # flat (the installers in older couch builds don't make folders)
          Copy-Item desktop/resources/tiles/*.png dist/
          # the live tile package reads its pictures from couch's folder
          Copy-Item desktop/resources/package/*.png dist/
          # trailers (YouTube) play through yt-dlp
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile dist/yt-dlp.exe
      - name: Live tile package (Windows 10)
        # a signed sparse package that gives couch.exe an identity, so it can
        # drive its Start tile. Needs COUCH_SIGN_PFX (base64 .pfx whose subject
        # is "CN=midnite couch") and COUCH_SIGN_PASS; without them: skipped.
        shell: pwsh
        env:
          PFX: ${{ secrets.COUCH_SIGN_PFX }}
          PFX_PASS: ${{ secrets.COUCH_SIGN_PASS }}
        run: |
          if (-not $env:PFX) { Write-Host "::warning::COUCH_SIGN_PFX not set; no live tile package"; exit 0 }
          $kit = Get-Item "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64" | Where-Object { Test-Path (Join-Path $_.FullName makeappx.exe) } | Sort-Object { [version]$_.Parent.Name } -Descending | Select-Object -First 1
          $makeappx = Join-Path $kit.FullName makeappx.exe
          $signtool = Join-Path $kit.FullName signtool.exe
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item desktop/resources/package/* pkg/
          & $makeappx pack /d pkg /p dist/couch.msix /nv /o
          if ($LASTEXITCODE) { exit 1 }
          $pfx = Join-Path $env:RUNNER_TEMP sign.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          & $signtool sign /fd SHA256 /f $pfx /p $env:PFX_PASS dist/couch.msix
          $signed = $LASTEXITCODE -eq 0
          if ($signed) {
            # the public half, so couch can ask Windows to trust it (once)
            $c = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:PFX_PASS)
            [IO.File]::WriteAllBytes("dist/couch.cer", $c.Export('Cert'))
          }
          Remove-Item $pfx
          if (-not $signed) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: couch-gpui-windows
          path: dist/
      - name: Publish (beta channel)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Compress-Archive -Path dist/* -DestinationPath couch-gpui.zip -Force
          $notes = git log -1 --pretty=%s
          gh release create "gpui-$env:COUCH_VERSION" couch-gpui.zip --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" --title "couch (new) $env:COUCH_VERSION" --notes "$notes"
