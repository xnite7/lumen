# Sets the bot's "About Me" (Usher, which also does couch's role checks) from bot/profile.json.
name: Bot profile
on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot-profile.yml"]
  workflow_dispatch:
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the bot's About Me
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::DISCORD_BOT_TOKEN not set"; exit 0; fi
          code=$(curl -s -o out.json -w "%{http_code}" -X PATCH https://discord.com/api/v10/applications/@me \
            -H "Authorization: Bot $TOKEN" -H "Content-Type: application/json" --data @bot/profile.json)
          echo "Discord said $code"; [ "$code" = "200" ] || { cat out.json; exit 1; }
