<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2e"/>
      <stop offset="1" stop-color="#0c0e16"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.44" r="0.5">
      <stop offset="0" stop-color="#FFF4CC"/>
      <stop offset="0.35" stop-color="#FFE9A8"/>
      <stop offset="0.7" stop-color="#FFC22E"/>
      <stop offset="1" stop-color="#E4736A"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#FFC22E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#77B9E4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
