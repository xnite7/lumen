  <path d="M64 600 H960" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5"/>
  <path d="M200 690 H824" stroke="#77B9E4" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <path d="M300 770 H724" stroke="#7DBF3F" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round"/>
  <rect x="66.5" y="66.5" width="891" height="891" rx="214" fill="none" stroke="url(#rim)" stroke-width="5"/>
