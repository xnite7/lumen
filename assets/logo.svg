  <rect x="64" y="64" width="896" height="896" rx="216" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="360" fill="url(#halo)"/>
  <circle cx="512" cy="452" r="188" fill="url(#sun)"/>
  <!-- the horizon: a glass slab the light sinks behind -->
