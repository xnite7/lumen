[package]
name = "couch-desktop"
version = "0.1.0"
edition = "2024"
description = "midnite™ couch — the native GPUI app for Windows"

[[bin]]
name = "couch"
path = "src/main.rs"

[dependencies]
couch = { package = "couch", path = "../src-tauri", default-features = false }
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.24.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
futures = "0.3"
unicode-segmentation = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false }
smallvec = "1"
urlencoding = "2"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
raw-window-handle = "0.6"

[profile.release]
# quick beta builds: parallel codegen, no link-time optimisation
codegen-units = 16
lto = false
opt-level = 3
strip = true

[patch.crates-io]
librqbit-dualstack-sockets = { path = "../src-tauri/patches/librqbit-dualstack-sockets" }
# newer libc dropped ENOATTR on Linux; gpui's tar helper still uses it
xattr = { path = "patches/xattr" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[build-dependencies]
embed-resource = "3"
